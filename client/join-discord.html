<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bergabung dengan Discord</title>
  <link rel="icon" type="image/png" href="https://i.ibb.co/4ZffCQHF/file-0000000037307207800c1b0df4ef447d.png" />
  <style>
    body{font-family:Helvetica,Arial,sans-serif;background:#05080f;color:#e8e4f0;display:flex;min-height:100vh;align-items:center;justify-content:center}
    .card{width: 90%; max-width:520px; box-sizing: border-box; padding:34px; border-radius:16px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);text-align:center;box-shadow: 0 20px 50px rgba(0,0,0,0.3);backdrop-filter: blur(10px);}
    .logo-container{margin-bottom: 22px; display: flex; flex-direction: column; align-items: center; gap: 12px;}
    .logo-img{width: 72px; height: 72px; border-radius: 50%; border: 2px solid rgba(201, 168, 76, 0.4); box-shadow: 0 0 15px rgba(201, 168, 76, 0.25); object-fit: cover;}
    .logo{font-weight:700;color:#c9a84c;font-size:20px;letter-spacing:2px;text-transform:uppercase;}
    .invite{display:inline-block;margin:14px 0;padding:12px 24px;border-radius:8px;background:linear-gradient(135deg,#10e7ff,#4dd9e8);color:#031018;text-decoration:none;font-weight:700;box-shadow: 0 4px 15px rgba(77,217,232,0.2);transition: transform 0.2s, box-shadow 0.2s;}
    .invite:hover{transform: translateY(-1px); box-shadow: 0 6px 20px rgba(77,217,232,0.35);}
    .verify{display:inline-block;margin-top:10px;padding:10px 18px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);color:#9d98b0;text-decoration:none;background:transparent;cursor:pointer;transition: all 0.2s;}
    .verify:hover{border-color: rgba(255,255,255,0.16); color: #e8e4f0; background: rgba(255,255,255,0.02);}
    p.note{color:#9d98b0;font-size:13px;line-height:1.6;margin-bottom:18px;}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <img class="logo-img" src="https://i.ibb.co/4ZffCQHF/file-0000000037307207800c1b0df4ef447d.png" alt="V STUDIO Logo" />
      <div class="logo">V STUDIO</div>
    </div>
    <h2 style="font-size: 22px; font-weight: 600; margin-bottom: 14px;" data-i18n="join.title">Bergabung dengan Komunitas Discord Kami</h2>
    <p class="note" data-i18n="join.note">Anda harus menjadi anggota server Discord kami untuk mengakses alat converter. Klik tombol undangan, lalu kembali dan klik tombol verifikasi.</p>
    <a class="invite" href="/join-discord/invite" target="_blank" rel="noopener" data-i18n="join.invite">Gabung Server Discord</a>
    <form method="get" action="/auth/discord/callback" style="margin-top:12px">
      <button class="verify" type="submit" data-i18n="join.verify">Saya Sudah Gabung - Verifikasi Keanggotaan</button>
    </form>
  </div>
  <script src="/js/i18n.js"></script>
</body>
</html>
